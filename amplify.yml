version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e '^ANTHROPIC_API_KEY=' -e '^ANTHROPIC_MODEL=' -e '^PDF_LAMBDA_URL=' -e '^NEXT_SERVER_PDF_LAMBDA_URL=' -e '^NEXT_PUBLIC_PDF_LAMBDA_URL=' -e '^PDF_SPLITTER_URL=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
